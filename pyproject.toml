[project]
name = "pr-decorator"
version = "1.0.4"
description = "Agentic system that decorates Pull/Merge Requests into a standardized MR report via AWS Bedrock (Amazon Nova Pro)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kunal Jha", email = "kunaljha5@gmail.com" }]
keywords = [
    "pull-request",
    "merge-request",
    "code-review",
    "aws",
    "bedrock",
    "nova",
    "git",
    "automation",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/kunaljha5/pr-decorator"
Repository = "https://github.com/kunaljha5/pr-decorator"
Issues = "https://github.com/kunaljha5/pr-decorator/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Full-spec YAML parsing for .pr-decorator.yml. Optional: the package ships a
# minimal vendored parser for the flat config schema and stays boto3-only
# without this. Install via `pip install pr-decorator[yaml]` for nested/advanced
# YAML support.
yaml = [
    "pyyaml>=6",
]
# Deps for the (preview) webhook-driven GitHub App under app/. The app/ package
# is NOT shipped in the wheel (see [tool.setuptools] packages) — these extras
# are for running the skeleton from a source checkout. See docs/github-app.md.
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[project.scripts]
pr-decorator = "main:main"
pr-decorator-merge = "agent.github:_cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "prompts"]
py-modules = ["main"]

[tool.setuptools.package-data]
prompts = ["*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ruff>=0.15.15",
]
